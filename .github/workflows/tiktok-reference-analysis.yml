name: TikTok Reference Analysis

on:
  push:
    branches: [stream-workshop-build]
    paths:
      - '.github/workflows/tiktok-reference-analysis.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          python -m pip install -U yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download reference
        run: |
          yt-dlp --no-playlist --merge-output-format mp4             -f "bv*+ba/b"             -o "/tmp/reference.%(ext)s"             "https://vm.tiktok.com/ZN86oD1eo/"
          FILE="$(find /tmp -maxdepth 1 -type f -name 'reference.*' | head -1)"
          test -n "$FILE"
          ffmpeg -y -i "$FILE" -c:v libx264 -preset veryfast -crf 18 -c:a aac -b:a 192k /tmp/reference.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of json /tmp/reference.mp4 > /tmp/probe.json
          mkdir -p /tmp/frames
          ffmpeg -y -i /tmp/reference.mp4 -vf "fps=1/1,scale=360:-2" /tmp/frames/f_%03d.jpg
          ffmpeg -y -i /tmp/reference.mp4 -vf "fps=1/1,scale=360:-2,tile=4x4" -frames:v 1 /tmp/contact.jpg || true
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-reference-analysis
          path: |
            /tmp/reference.mp4
            /tmp/probe.json
            /tmp/contact.jpg
            /tmp/frames
          retention-days: 7
