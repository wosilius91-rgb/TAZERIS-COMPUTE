name: TAZERIS Brain V5

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */5 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: tazeris-brain-v5
  cancel-in-progress: false

jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
      TAZERIS_MAX_RUNTIME_SECONDS: "18000"

    steps:
      - uses: actions/checkout@v4

      - name: Restore Brain state
        uses: actions/cache/restore@v4
        with:
          path: ~/.tazeris
          key: tazeris-v5-state-${{ github.run_id }}
          restore-keys: |
            tazeris-v5-state-

      - name: Verify secret
        run: |
          test -n "$GH_TOKEN"
          echo "GH TOKEN: OK"

      - name: Verify Brain
        run: |
          python -m py_compile brain/tazeris_brain_v5.py
          echo "BRAIN PYTHON: OK"

      - name: Run TAZERIS Brain V5
        run: |
          python -u brain/tazeris_brain_v5.py

      - name: Save Brain state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.tazeris
          key: tazeris-v5-state-${{ github.run_id }}
