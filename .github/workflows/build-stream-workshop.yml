name: Build TAZERIS Video Dirbtuve

on:
  push:
    branches: [stream-workshop-build]
    paths:
      - 'stream-workshop/**'
      - '.github/workflows/build-stream-workshop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stream-workshop-build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          echo "SDKMANAGER=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p stream-workshop :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s stream-workshop/app/build/outputs/apk/debug/app-debug.apk
          ls -lh stream-workshop/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TAZERIS-Video-Dirbtuve
          path: stream-workshop/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
