name: TAZERIS Compute

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "TAZERIS compute task"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tazeris-compute
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Prepare prompt
        env:
          TAZERIS_PROMPT: ${{ inputs.prompt }}
        run: |
          printf '%s' "$TAZERIS_PROMPT" > prompt.txt

      - name: Run TAZERIS Compute
        run: |
          ./scripts/run_compute.sh prompt.txt result.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: tazeris-result
          path: result.txt
          retention-days: 1
