name: Runtime Smoke 2 TAZERIS Video Dirbtuve

on:
  push:
    branches: [stream-workshop-build]
    paths:
      - '.github/workflows/runtime2-stream-workshop.yml'
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stream-workshop-build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p stream-workshop :app:assembleDebug
      - name: Emulator install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            APK=stream-workshop/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.tazeris.streamworkshop/.MainActivity | tee /tmp/am2.txt
            sleep 7
            PID="$(adb shell pidof com.tazeris.streamworkshop | tr -d '\r')"
            echo "PID=$PID"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -q "com.tazeris.streamworkshop"
            adb logcat -d > /tmp/logcat2.txt
            if grep -qE "FATAL EXCEPTION|Process: com.tazeris.streamworkshop.*has died" /tmp/logcat2.txt; then
              grep -A60 -B15 -E "FATAL EXCEPTION|Process: com.tazeris.streamworkshop.*has died" /tmp/logcat2.txt
              exit 1
            fi
            echo "ANDROID_RUNTIME_SMOKE_2=PASS"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime2-logs
          path: |
            /tmp/am2.txt
            /tmp/logcat2.txt
          retention-days: 7
