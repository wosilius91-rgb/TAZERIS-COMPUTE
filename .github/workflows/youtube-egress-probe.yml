name: TAZERIS YouTube Egress Probe

on:
  push:
    paths:
      - '.github/workflows/youtube-egress-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install video tools
        run: |
          python -m pip install --upgrade "yt-dlp[default]" "bgutil-ytdlp-pot-provider==2.0.0"
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Start PO token provider
        run: |
          docker run -d --name pot -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:deno
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4416/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker logs pot --tail 20

      - name: Resolve and download media sample
        run: |
          set -euo pipefail
          "$HOME/.deno/bin/deno" --version
          yt-dlp -v --no-playlist --js-runtimes deno --remote-components ejs:github \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            --extractor-args "youtube:player_client=mweb" \
            --download-sections "*0-3" \
            -o "/tmp/probe.%(ext)s" \
            "https://www.youtube.com/watch?v=jNQXAC9IVRw"
          ls -lh /tmp/probe*
