<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="robots" content="noindex,nofollow">
<title>TAZERIS AI</title>
<style>
:root{--bg:#090b10;--card:#141923;--line:#293140;--txt:#f5f7fb;--muted:#99a4b4;--accent:#7697ff;--bad:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:780px;margin:auto;min-height:100vh;padding:14px 12px 120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:5px 2px 14px}
.brand{font-size:21px;font-weight:900;letter-spacing:.5px}
.state{font-size:12px;color:#cfe1ff;border:1px solid #33425f;border-radius:999px;padding:5px 9px}
select{width:100%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.hint{font-size:12px;color:var(--muted);margin:0 2px 12px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{border-radius:17px;padding:13px 14px;white-space:pre-wrap;word-break:break-word}
.msg pre{overflow:auto;background:#0b0f16;border:1px solid #273142;border-radius:10px;padding:11px;white-space:pre}
.msg code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#0b0f16;border-radius:5px;padding:1px 4px}
.msg pre code{background:transparent;padding:0}
.msg strong{font-weight:800}
.user{background:#26355c;margin-left:10%}
.bot{background:var(--card);border:1px solid var(--line);margin-right:3%}
.meta{font-size:11px;color:var(--muted);margin-top:7px}
.imageWrap{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:10px}
.imageWrap img{display:block;width:100%;height:auto;border-radius:12px}
.composer{position:fixed;left:0;right:0;bottom:0;padding:20px 12px 12px;background:linear-gradient(180deg,#090b1000,#090b10 22%)}
.composerIn{max-width:780px;margin:auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-height:54px;max-height:160px;resize:none;background:#111720;color:var(--txt);border:1px solid var(--line);border-radius:15px;padding:14px;outline:none}
textarea:focus{border-color:#526ca7}
button{border:0;border-radius:14px;padding:15px 18px;background:var(--accent);color:white;font-weight:850;font-size:15px}
button:disabled{opacity:.55}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">TAZERIS AI</div>
    <div class="state" id="state">Paruošta</div>
  </div>
  <select id="mode">
    <option value="auto" selected>AUTO</option>
    <option value="text">Klausimas / tekstas</option>
    <option value="image">Nuotrauka</option>
  </select>
  <div class="hint">Be registracijos, SMS ir API raktų. Tekstui naudojamas stipresnis serverio AI, nuotraukoms – generatyvinis vaizdų modelis.</div>
  <div class="chat" id="chat">
    <div class="msg bot">Rašyk, ko reikia. Gali klausti, prašyti kodo arba parašyti „sukurk nuotrauką…“.<div class="meta">TAZERIS AI</div></div>
  </div>
</div>

<div class="composer">
  <div class="composerIn">
    <textarea id="prompt" placeholder="Rašyk čia…"></textarea>
    <button id="send">Siųsti</button>
  </div>
</div>

<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

const $=id=>document.getElementById(id);
const chat=$("chat"), box=$("prompt"), send=$("send"), mode=$("mode"), state=$("state");
let textClientPromise=null, imageClientPromise=null, textEndpoint=null, imageEndpoint=null;
let conversation=[];

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

function renderLiteMarkdown(text){
  const blocks=[];
  let s=String(text).replace(/```(?:[a-zA-Z0-9_+-]+)?\n([\s\S]*?)```/g,(_,code)=>{
    const id="@@CODE"+blocks.length+"@@";
    blocks.push("<pre><code>"+escapeHtml(code.trim())+"</code></pre>");
    return id;
  });
  s=escapeHtml(s);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  s=s.replace(/(^|\n)-\s+/g,"$1• ");
  s=s.replace(/\n/g,"<br>");
  blocks.forEach((html,i)=>{s=s.replace("@@CODE"+i+"@@",html)});
  return s;
}

function addText(text,kind="bot",meta="",rich=false){
  const d=document.createElement("div");
  d.className="msg "+kind;
  if(rich) d.innerHTML=renderLiteMarkdown(text);
  else d.textContent=text;
  if(meta){
    const m=document.createElement("div");
    m.className="meta";
    m.textContent=meta;
    d.appendChild(m);
  }
  chat.appendChild(d);
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  return d;
}

function busy(v,label="Dirba…"){
  send.disabled=v;
  send.textContent=v?"…":"Siųsti";
  state.textContent=v?label:"Paruošta";
}

function errText(e){
  if(typeof e==="string") return e;
  if(e?.message) return e.message;
  if(e?.error) return typeof e.error==="string"?e.error:JSON.stringify(e.error);
  try{return JSON.stringify(e)}catch(_){return "Nežinoma klaida"}
}

function wantsImage(q){
  return /\b(sukurk|sugeneruok|nupiešk|padaryk|create|generate|draw)\b[\s\S]{0,120}\b(nuotrauk|foto|fotograf|paveiksl|vaizd|iliustr|image|photo|picture)\w*/i.test(q);
}

function contentText(c){
  if(typeof c==="string") return c;
  if(Array.isArray(c)) return c.map(x=>contentText(x)).filter(Boolean).join("\n");
  if(c && typeof c==="object"){
    if(typeof c.text==="string") return c.text;
    if(typeof c.content==="string") return c.content;
  }
  return "";
}

async function chooseEndpoint(client,candidates){
  try{
    const api=await client.view_api();
    const named=api?.named_endpoints||{};
    const keys=Object.keys(named);
    for(const c of candidates) if(keys.includes(c)) return c;
    for(const c of candidates){
      const token=c.replaceAll("/","").toLowerCase();
      const hit=keys.find(k=>k.replaceAll("/","").toLowerCase().includes(token));
      if(hit) return hit;
    }
  }catch(_){}
  return candidates[0];
}

async function textClient(){
  if(!textClientPromise){
    textClientPromise=Client.connect("akhaliq/Qwen3-VL-4B-Instruct");
  }
  const c=await textClientPromise;
  if(!textEndpoint) textEndpoint=await chooseEndpoint(c,["/chat_fn"]);
  return c;
}

async function imageClient(){
  if(!imageClientPromise){
    imageClientPromise=Client.connect("black-forest-labs/FLUX.1-schnell");
  }
  const c=await imageClientPromise;
  if(!imageEndpoint) imageEndpoint=await chooseEndpoint(c,["/infer"]);
  return c;
}

async function runTextRequest(userText,history=[]){
  const client=await textClient();
  const prepared=
    "Atsakyk LIETUVIŠKAI. Pirmas sakinys turi tiesiai atsakyti į klausimą. Būk tikslus, konkretus ir praktiškas. "+
    "Į paprastą klausimą atsakyk trumpai – dažniausiai 1–5 sakiniais. Sąrašų, pamokų ir pavyzdžių nedėk, jei vartotojas jų neprašė. "+
    "Jei vartotojas klausia, ar tu moki / gali ką nors padaryti, atsakyk apie SAVO gebėjimą tai atlikti, o ne aiškink, kaip vartotojui to mokytis. "+
    "Jei prašoma programavimo užduoties, pateik teisingą sprendimą ir kodą. "+
    "Jei kažko tikrai nežinai, aiškiai tai pasakyk. Neprikurk faktų.\n\n"+
    "Vartotojo klausimas:\n"+userText;

  const result=await client.predict(textEndpoint,[
    {text:prepared,files:[]},
    history
  ]);
  const data=result?.data||[];
  const hist=Array.isArray(data[1])?data[1]:[];
  const assistant=[...hist].reverse().find(x=>x?.role==="assistant");
  const answer=contentText(assistant?.content).trim();
  if(!answer) throw new Error("Teksto AI negrąžino atsakymo.");
  return answer;
}

async function answerText(q){
  busy(true,"Klausiu AI…");
  const answer=await runTextRequest(q,conversation);
  conversation.push({role:"user",content:q},{role:"assistant",content:answer});
  if(conversation.length>12) conversation=conversation.slice(-12);
  addText(answer,"bot","TAZERIS AI",true);
}

async function translateImagePrompt(q){
  try{
    const client=await textClient();
    const prompt=
      "Translate the Lithuanian image request below into ONE concise, vivid English text-to-image prompt. "+
      "Preserve brand names and intent. Output ONLY the English prompt, no explanation.\n\n"+q;
    const result=await client.predict(textEndpoint,[
      {text:prompt,files:[]},
      []
    ]);
    const data=result?.data||[];
    const hist=Array.isArray(data[1])?data[1]:[];
    const assistant=[...hist].reverse().find(x=>x?.role==="assistant");
    return contentText(assistant?.content).trim()||q;
  }catch(_){
    return q;
  }
}

function fileUrls(file){
  const urls=[];
  if(typeof file==="string") urls.push(file);
  if(file?.url) urls.push(file.url);
  if(file?.path){
    urls.push("https://black-forest-labs-flux-1-schnell.hf.space/file="+file.path);
  }
  return [...new Set(urls.filter(Boolean))];
}

async function loadOne(img,urls){
  let last=null;
  for(const url of urls){
    try{
      await new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(new Error("timeout")),45000);
        img.onload=()=>{clearTimeout(timer);resolve()};
        img.onerror=()=>{clearTimeout(timer);reject(new Error("load"))};
        img.src=url;
      });
      return;
    }catch(e){last=e}
  }
  throw last||new Error("Nepavyko atidaryti sugeneruotos nuotraukos.");
}

function isTazerisPromo(q){
  return /tazer/i.test(q) && /reklam|promo|baner|banner|poster|vizual|nuotrauk|foto/i.test(q);
}

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function localTazerisPromo(q){
  const canvas=document.createElement("canvas");
  canvas.width=1080; canvas.height=1080;
  const ctx=canvas.getContext("2d");

  const bg=ctx.createLinearGradient(0,0,1080,1080);
  bg.addColorStop(0,"#07101f");
  bg.addColorStop(.48,"#101936");
  bg.addColorStop(1,"#05070d");
  ctx.fillStyle=bg; ctx.fillRect(0,0,1080,1080);

  ctx.globalAlpha=.16;
  ctx.strokeStyle="#80a3ff";
  ctx.lineWidth=1;
  for(let x=0;x<=1080;x+=54){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,1080);ctx.stroke()}
  for(let y=0;y<=1080;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1080,y);ctx.stroke()}
  ctx.globalAlpha=1;

  const glow=ctx.createRadialGradient(820,225,10,820,225,390);
  glow.addColorStop(0,"rgba(113,145,255,.65)");
  glow.addColorStop(.45,"rgba(96,80,255,.23)");
  glow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=glow;ctx.fillRect(420,-170,660,720);

  const glow2=ctx.createRadialGradient(180,900,10,180,900,330);
  glow2.addColorStop(0,"rgba(62,218,255,.28)");
  glow2.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=glow2;ctx.fillRect(-160,580,680,500);

  ctx.strokeStyle="rgba(150,177,255,.8)";
  ctx.lineWidth=3;
  const nodes=[[770,190],[860,270],[720,330],[900,390],[800,470]];
  nodes.forEach(([x,y],i)=>{
    if(i){ctx.beginPath();ctx.moveTo(nodes[i-1][0],nodes[i-1][1]);ctx.lineTo(x,y);ctx.stroke()}
    ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fillStyle="#9bb3ff";ctx.fill();
  });

  ctx.fillStyle="#9bb3ff";
  ctx.font="700 28px system-ui, sans-serif";
  ctx.letterSpacing="5px";
  ctx.fillText("TAZERIS",72,105);

  ctx.fillStyle="#ffffff";
  ctx.font="900 122px system-ui, sans-serif";
  ctx.fillText("TAZERIS",68,330);
  const aiGrad=ctx.createLinearGradient(68,350,430,470);
  aiGrad.addColorStop(0,"#80a3ff");aiGrad.addColorStop(1,"#55e3ff");
  ctx.fillStyle=aiGrad;
  ctx.fillText("AI",68,458);

  ctx.fillStyle="#d9e2f7";
  ctx.font="700 42px system-ui, sans-serif";
  ctx.fillText("VIENAS PROTAS. DAUGIAU GALIOS.",72,565);

  ctx.fillStyle="#9daac1";
  ctx.font="400 30px system-ui, sans-serif";
  ctx.fillText("Klausimai • kodas • idėjos • kūryba",72,625);

  roundRect(ctx,72,720,650,100,50);
  const pill=ctx.createLinearGradient(72,720,722,820);
  pill.addColorStop(0,"#6f91ff");pill.addColorStop(1,"#5567ff");
  ctx.fillStyle=pill;ctx.fill();
  ctx.fillStyle="#fff";ctx.font="800 33px system-ui, sans-serif";
  ctx.fillText("KLAUSK. KURK. DARYK.",112,783);

  ctx.fillStyle="rgba(255,255,255,.58)";
  ctx.font="500 22px system-ui, sans-serif";
  ctx.fillText("TAZERIS AI • TEST VERSION",72,1000);

  const wrap=document.createElement("div");
  wrap.className="imageWrap";
  const img=document.createElement("img");
  img.alt=q;
  img.src=canvas.toDataURL("image/png");
  wrap.appendChild(img);
  const m=document.createElement("div");
  m.className="meta";
  m.textContent="TAZERIS AI · reklaminis vizualas · be GPU limito";
  wrap.appendChild(m);
  chat.appendChild(wrap);
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

async function answerImage(q){
  if(isTazerisPromo(q)){
    busy(true,"Kuriamas TAZERIS reklaminis vizualas…");
    localTazerisPromo(q);
    return;
  }

  busy(true,"Ruošiu nuotraukos užklausą…");
  const englishPrompt=await translateImagePrompt(q);
  busy(true,"Kuriama nuotrauka…");

  const client=await imageClient();
  let result;
  try{
    result=await client.predict(imageEndpoint,[
    englishPrompt,
    0,
    true,
    1024,
    1024,
    4
    ]);
  }catch(e){
    const msg=errText(e);
    if(/ZeroGPU quota|exceeded your.*quota/i.test(msg)){
      throw new Error("Nemokamo nuotraukų AI GPU limitas šiuo metu išnaudotas. TAZERIS reklaminį vizualą galiu sukurti vietoje be šio limito.");
    }
    throw e;
  }

  const file=result?.data?.[0];
  const urls=fileUrls(file);
  if(!urls.length) throw new Error("Vaizdų modelis negrąžino nuotraukos.");

  const wrap=document.createElement("div");
  wrap.className="imageWrap";
  const img=document.createElement("img");
  img.alt=q;
  await loadOne(img,urls);
  wrap.appendChild(img);

  const m=document.createElement("div");
  m.className="meta";
  m.textContent="TAZERIS AI · nuotrauka";
  wrap.appendChild(m);
  chat.appendChild(wrap);
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

async function run(){
  const q=box.value.trim();
  if(!q||send.disabled) return;
  box.value="";
  addText(q,"user");
  busy(true);
  try{
    if(mode.value==="image"||(mode.value==="auto"&&wantsImage(q))){
      await answerImage(q);
    }else{
      await answerText(q);
    }
  }catch(e){
    addText(
      "Nepavyko: "+errText(e)+"\n\nNemokamas testinis AI serveris gali būti laikinai užimtas. Bandyk dar kartą po kelių sekundžių.",
      "bot",
      "Klaida"
    );
  }finally{
    busy(false);
    box.focus();
  }
}

send.addEventListener("click",run);
box.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    run();
  }
});
</script>
</body>
</html>
