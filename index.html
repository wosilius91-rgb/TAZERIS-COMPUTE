<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="robots" content="noindex,nofollow">
<title>TAZERIS AI</title>
<style>
:root{--bg:#090b10;--card:#141923;--line:#293140;--txt:#f5f7fb;--muted:#99a4b4;--accent:#7697ff;--bad:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:780px;margin:auto;min-height:100vh;padding:14px 12px 120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:5px 2px 14px}
.brand{font-size:21px;font-weight:900;letter-spacing:.5px}
.state{font-size:12px;color:#cfe1ff;border:1px solid #33425f;border-radius:999px;padding:5px 9px}
select{width:100%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.hint{font-size:12px;color:var(--muted);margin:0 2px 12px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{border-radius:17px;padding:13px 14px;white-space:pre-wrap;word-break:break-word}
.user{background:#26355c;margin-left:10%}
.bot{background:var(--card);border:1px solid var(--line);margin-right:3%}
.meta{font-size:11px;color:var(--muted);margin-top:7px}
.imageWrap{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:10px}
.imageWrap img{display:block;width:100%;height:auto;border-radius:12px}
.composer{position:fixed;left:0;right:0;bottom:0;padding:20px 12px 12px;background:linear-gradient(180deg,#090b1000,#090b10 22%)}
.composerIn{max-width:780px;margin:auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-height:54px;max-height:160px;resize:none;background:#111720;color:var(--txt);border:1px solid var(--line);border-radius:15px;padding:14px;outline:none}
textarea:focus{border-color:#526ca7}
button{border:0;border-radius:14px;padding:15px 18px;background:var(--accent);color:white;font-weight:850;font-size:15px}
button:disabled{opacity:.55}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">TAZERIS AI</div>
    <div class="state" id="state">Paruošta</div>
  </div>
  <select id="mode">
    <option value="auto" selected>AUTO</option>
    <option value="text">Klausimas / tekstas</option>
    <option value="image">Nuotrauka</option>
  </select>
  <div class="hint">Be registracijos, SMS ir API raktų. Tekstui naudojamas stipresnis serverio AI, nuotraukoms – generatyvinis vaizdų modelis.</div>
  <div class="chat" id="chat">
    <div class="msg bot">Rašyk, ko reikia. Gali klausti, prašyti kodo arba parašyti „sukurk nuotrauką…“.<div class="meta">TAZERIS AI</div></div>
  </div>
</div>

<div class="composer">
  <div class="composerIn">
    <textarea id="prompt" placeholder="Rašyk čia…"></textarea>
    <button id="send">Siųsti</button>
  </div>
</div>

<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

const $=id=>document.getElementById(id);
const chat=$("chat"), box=$("prompt"), send=$("send"), mode=$("mode"), state=$("state");
let textClientPromise=null, imageClientPromise=null, textEndpoint=null, imageEndpoint=null;
let conversation=[];

function addText(text,kind="bot",meta=""){
  const d=document.createElement("div");
  d.className="msg "+kind;
  d.textContent=text;
  if(meta){
    const m=document.createElement("div");
    m.className="meta";
    m.textContent=meta;
    d.appendChild(m);
  }
  chat.appendChild(d);
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  return d;
}

function busy(v,label="Dirba…"){
  send.disabled=v;
  send.textContent=v?"…":"Siųsti";
  state.textContent=v?label:"Paruošta";
}

function errText(e){
  if(typeof e==="string") return e;
  if(e?.message) return e.message;
  if(e?.error) return typeof e.error==="string"?e.error:JSON.stringify(e.error);
  try{return JSON.stringify(e)}catch(_){return "Nežinoma klaida"}
}

function wantsImage(q){
  return /\b(sukurk|sugeneruok|nupiešk|padaryk|create|generate|draw)\b[\s\S]{0,90}\b(nuotrauk|paveiksl|vaizd|iliustr|image|photo|picture)\w*/i.test(q);
}

function contentText(c){
  if(typeof c==="string") return c;
  if(Array.isArray(c)) return c.map(x=>contentText(x)).filter(Boolean).join("\n");
  if(c && typeof c==="object"){
    if(typeof c.text==="string") return c.text;
    if(typeof c.content==="string") return c.content;
  }
  return "";
}

async function chooseEndpoint(client,candidates){
  try{
    const api=await client.view_api();
    const named=api?.named_endpoints||{};
    const keys=Object.keys(named);
    for(const c of candidates) if(keys.includes(c)) return c;
    for(const c of candidates){
      const token=c.replaceAll("/","").toLowerCase();
      const hit=keys.find(k=>k.replaceAll("/","").toLowerCase().includes(token));
      if(hit) return hit;
    }
  }catch(_){}
  return candidates[0];
}

async function textClient(){
  if(!textClientPromise){
    textClientPromise=Client.connect("akhaliq/Qwen3-VL-4B-Instruct");
  }
  const c=await textClientPromise;
  if(!textEndpoint) textEndpoint=await chooseEndpoint(c,["/chat_fn"]);
  return c;
}

async function imageClient(){
  if(!imageClientPromise){
    imageClientPromise=Client.connect("black-forest-labs/FLUX.1-schnell");
  }
  const c=await imageClientPromise;
  if(!imageEndpoint) imageEndpoint=await chooseEndpoint(c,["/infer"]);
  return c;
}

async function runTextRequest(userText,history=[]){
  const client=await textClient();
  const prepared=
    "Atsakyk LIETUVIŠKAI. Būk tikslus, konkretus ir praktiškas. "+
    "Jei klausimas apie programavimą, pateik teisingą sprendimą ir kodą. "+
    "Jei kažko tikrai nežinai, aiškiai tai pasakyk. Neprikurk faktų.\n\n"+
    "Vartotojo klausimas:\n"+userText;

  const result=await client.predict(textEndpoint,[
    {text:prepared,files:[]},
    history
  ]);
  const data=result?.data||[];
  const hist=Array.isArray(data[1])?data[1]:[];
  const assistant=[...hist].reverse().find(x=>x?.role==="assistant");
  const answer=contentText(assistant?.content).trim();
  if(!answer) throw new Error("Teksto AI negrąžino atsakymo.");
  return answer;
}

async function answerText(q){
  busy(true,"Klausiu AI…");
  const answer=await runTextRequest(q,conversation);
  conversation.push({role:"user",content:q},{role:"assistant",content:answer});
  if(conversation.length>12) conversation=conversation.slice(-12);
  addText(answer,"bot","TAZERIS AI");
}

async function translateImagePrompt(q){
  try{
    const client=await textClient();
    const prompt=
      "Translate the Lithuanian image request below into ONE concise, vivid English text-to-image prompt. "+
      "Preserve brand names and intent. Output ONLY the English prompt, no explanation.\n\n"+q;
    const result=await client.predict(textEndpoint,[
      {text:prompt,files:[]},
      []
    ]);
    const data=result?.data||[];
    const hist=Array.isArray(data[1])?data[1]:[];
    const assistant=[...hist].reverse().find(x=>x?.role==="assistant");
    return contentText(assistant?.content).trim()||q;
  }catch(_){
    return q;
  }
}

function fileUrls(file){
  const urls=[];
  if(typeof file==="string") urls.push(file);
  if(file?.url) urls.push(file.url);
  if(file?.path){
    urls.push("https://black-forest-labs-flux-1-schnell.hf.space/file="+file.path);
  }
  return [...new Set(urls.filter(Boolean))];
}

async function loadOne(img,urls){
  let last=null;
  for(const url of urls){
    try{
      await new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(new Error("timeout")),45000);
        img.onload=()=>{clearTimeout(timer);resolve()};
        img.onerror=()=>{clearTimeout(timer);reject(new Error("load"))};
        img.src=url;
      });
      return;
    }catch(e){last=e}
  }
  throw last||new Error("Nepavyko atidaryti sugeneruotos nuotraukos.");
}

async function answerImage(q){
  busy(true,"Ruošiu nuotraukos užklausą…");
  const englishPrompt=await translateImagePrompt(q);
  busy(true,"Kuriama nuotrauka…");

  const client=await imageClient();
  const result=await client.predict(imageEndpoint,{
    prompt:englishPrompt,
    seed:0,
    randomize_seed:true,
    width:1024,
    height:1024,
    num_inference_steps:4
  });

  const file=result?.data?.[0];
  const urls=fileUrls(file);
  if(!urls.length) throw new Error("Vaizdų modelis negrąžino nuotraukos.");

  const wrap=document.createElement("div");
  wrap.className="imageWrap";
  const img=document.createElement("img");
  img.alt=q;
  await loadOne(img,urls);
  wrap.appendChild(img);

  const m=document.createElement("div");
  m.className="meta";
  m.textContent="TAZERIS AI · nuotrauka";
  wrap.appendChild(m);
  chat.appendChild(wrap);
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

async function run(){
  const q=box.value.trim();
  if(!q||send.disabled) return;
  box.value="";
  addText(q,"user");
  busy(true);
  try{
    if(mode.value==="image"||(mode.value==="auto"&&wantsImage(q))){
      await answerImage(q);
    }else{
      await answerText(q);
    }
  }catch(e){
    addText(
      "Nepavyko: "+errText(e)+"\n\nNemokamas testinis AI serveris gali būti laikinai užimtas. Bandyk dar kartą po kelių sekundžių.",
      "bot",
      "Klaida"
    );
  }finally{
    busy(false);
    box.focus();
  }
}

send.addEventListener("click",run);
box.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    run();
  }
});
</script>
</body>
</html>
